[build]
  command = "# no build command"
  publish = "."
  functions = "netlify/functions"

# Las rutas /api/create-preference y /api/webhook se declaran en cada función
# (export const config = { path: ... }), no hace falta redirect.

# El sitio se publica desde la raíz del repo: estos archivos no deben ser públicos.
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/README_PAGOS.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.env.example"
  to = "/404"
  status = 404
  force = true

# Las páginas de resultado de pago no se indexan ni se cachean.
[[headers]]
  for = "/pago/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
