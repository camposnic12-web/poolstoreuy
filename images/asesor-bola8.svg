    <rect x="56" y="84" width="7" height="34" rx="3" fill="#141414"/>
    <rect x="56" y="-6" width="7" height="9" rx="3" fill="#2F7FD8" stroke="#141414" stroke-width="3"/>
    <rect x="56" y="78" width="7" height="4" fill="#fff"/>
  </g>
  <!-- bola -->
  <circle cx="58" cy="64" r="43" fill="#141414" stroke="#141414" stroke-width="3"/>
  <ellipse cx="40" cy="40" rx="15" ry="9" fill="#fff" opacity=".22" transform="rotate(-35 40 40)"/>
