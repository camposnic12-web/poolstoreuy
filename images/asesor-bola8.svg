  <circle cx="74" cy="40" r="15" fill="#fff"/>
  <text x="74" y="47.5" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="21" fill="#141414">8</text>
  <!-- cara -->
