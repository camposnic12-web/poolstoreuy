  <path d="M38 81 Q50 93 63 81" fill="#E51820" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="31" cy="76" rx="4.5" ry="2.6" fill="#E51820" opacity=".55"/>
  <ellipse cx="70" cy="76" rx="4.5" ry="2.6" fill="#E51820" opacity=".55"/>
  <!-- mano saludando -->
  <g class="ps-mano">
